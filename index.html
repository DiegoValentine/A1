<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Um Girassol sob o Céu</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #142b45;
    cursor: pointer;
}

canvas {
    display: block;
    width: 100%;
    height: 100%;
}

#caption {
    position: fixed;
    top: 35px;
    left: 50%;
    transform: translateX(-50%);
    text-align: center;
    color: #f3d99a;
    font-family: Georgia, serif;
    pointer-events: none;
    text-shadow: 2px 3px 8px #26334b;
    width: 100%;
}

#caption h1 {
    font-weight: normal;
    font-size: clamp(25px, 4vw, 43px);
    letter-spacing: 3px;
}

#caption p {
    font-size: 12px;
    letter-spacing: 4px;
    margin-top: 12px;
    opacity: .8;
}

#period {
    position: fixed;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff0bd;
    font: 14px Georgia, serif;
    letter-spacing: 5px;
    pointer-events: none;
    text-shadow: 2px 2px 5px #17263a;
}

#instruction {
    position: fixed;
    bottom: 12px;
    width: 100%;
    text-align: center;
    font: 10px Georgia, serif;
    letter-spacing: 2px;
    color: #f3d99a;
    opacity: .7;
    pointer-events: none;
}
</style>
</head>

<body>

<canvas id="painting"></canvas>

<div id="caption">
    <h1>O Jardim dos Girassóis</h1>
    <p>UMA PINTURA EM MOVIMENTO</p>
</div>

<div id="period">AMANHECER</div>
<div id="instruction">CLIQUE PARA TRANSFORMAR O CÉU</div>

<script>
const canvas = document.getElementById("painting");
const ctx = canvas.getContext("2d");

let W, H;
let time = 0;
let targetTime = 0;
let wind = 0;
let windTarget = 0;
let lastWind = 0;

const periods = [
    "AMANHECER",
    "DIA",
    "TARDE",
    "NOITE"
];

// Paletas pictóricas
const palettes = [
    {
        sky: ["#bd7659", "#e6a46d", "#f0c17d", "#6b7881"],
        glow: "#f5cf83",
        ground: ["#52633a", "#9a803d", "#344b36"],
        stars: false
    },
    {
        sky: ["#145d91", "#287eb1", "#78a8ae", "#e0c17d"],
        glow: "#f5d56e",
        ground: ["#52713c", "#b18a42", "#344b36"],
        stars: false
    },
    {
        sky: ["#693d59", "#bb6253", "#e99961", "#d6a06a"],
        glow: "#f5a45e",
        ground: ["#55432e", "#a16b38", "#34422d"],
        stars: false
    },
    {
        sky: ["#091c42", "#153866", "#23527b", "#192e4c"],
        glow: "#e5dfbd",
        ground: ["#203a36", "#365044", "#142a2b"],
        stars: true
    }
];

function resize() {
    W = canvas.width = window.innerWidth * devicePixelRatio;
    H = canvas.height = window.innerHeight * devicePixelRatio;
    ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
    W = window.innerWidth;
    H = window.innerHeight;
    drawBackground();
}

window.addEventListener("resize", resize);

// Mistura de cores
function mixColor(a, b, amount) {
    const ah = parseInt(a.slice(1), 16);
    const bh = parseInt(b.slice(1), 16);

    const ar = ah >> 16;
    const ag = (ah >> 8) & 255;
    const ab = ah & 255;

    const br = bh >> 16;
    const bg = (bh >> 8) & 255;
    const bb = bh & 255;

    const r = Math.round(ar + (br-ar)*amount);
    const g = Math.round(ag + (bg-ag)*amount);
    const bl = Math.round(ab + (bb-ab)*amount);

    return "#" + [r,g,bl]
        .map(v => v.toString(16).padStart(2,"0"))
        .join("");
}

function getPalette() {
    const a = Math.floor(time) % 4;
    const b = (a+1)%4;
    const f = time - Math.floor(time);

    return {
        sky: palettes[a].sky.map((c,i) =>
            mixColor(c, palettes[b].sky[i], f)
        ),
        glow: mixColor(
            palettes[a].glow,
            palettes[b].glow,
            f
        ),
        ground: palettes[a].ground.map((c,i) =>
            mixColor(c, palettes[b].ground[i], f)
        ),
        stars: time > 2.7 || time < 0.3
    };
}

// Pincelada orgânica
function brush(x,y,length,angle,color,width=3) {
    ctx.save();
    ctx.translate(x,y);
    ctx.rotate(angle);

    ctx.beginPath();
    ctx.moveTo(-length/2, 0);

    ctx.quadraticCurveTo(
        0,
        -width*0.8,
        length/2,
        0
    );

    ctx.quadraticCurveTo(
        0,
        width*0.9,
        -length/2,
        0
    );

    ctx.fillStyle = color;
    ctx.fill();

    ctx.restore();
}

// Gerar céu pintado
let skyStrokes = [];

function generateSky() {
    skyStrokes = [];

    for(let i=0;i<1800;i++) {
        skyStrokes.push({
            x: Math.random()*W,
            y: Math.random()*H*.78,
            length: 15+Math.random()*65,
            angle: (Math.random()-.5)*.8,
            color: Math.floor(Math.random()*4),
            width: 2+Math.random()*8
        });
    }
}

// Fundo com pinceladas
function drawBackground() {
    const p = getPalette();

    const gradient = ctx.createLinearGradient(0,0,0,H);

    gradient.addColorStop(0,p.sky[0]);
    gradient.addColorStop(.32,p.sky[1]);
    gradient.addColorStop(.66,p.sky[2]);
    gradient.addColorStop(1,p.sky[3]);

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,W,H);

    // Pinceladas onduladas
    for(const s of skyStrokes) {
        const color = p.sky[s.color];

        const wave = Math.sin(
            s.x*.006 + s.y*.008 + performance.now()*.0002
        ) * 12;

        brush(
            s.x,
            s.y+wave,
            s.length,
            s.angle + Math.sin(s.y*.01)*.2,
            color,
            s.width
        );
    }

    // Grandes redemoinhos celestes
    for(let j=0;j<5;j++) {
        const cx = W*(.13+j*.19);
        const cy = H*(.19+(j%2)*.16);

        ctx.beginPath();

        for(let i=0;i<100;i++) {
            const a = i*.09;
            const r = 5+i*1.05;

            const x = cx + Math.cos(a)*r*1.6;
            const y = cy + Math.sin(a)*r*.42;

            if(i===0) ctx.moveTo(x,y);
            else ctx.lineTo(x,y);
        }

        ctx.strokeStyle = p.sky[(j+1)%4];
        ctx.lineWidth = 8;
        ctx.globalAlpha = .35;
        ctx.stroke();
        ctx.globalAlpha = 1;
    }

    // Sol ou lua
    const sunX = W*.78;
    const sunY = H*(.23 + Math.sin(time*Math.PI/2)*.08);

    for(let i=0;i<12;i++) {
        ctx.beginPath();
        ctx.ellipse(
            sunX,
            sunY,
            45+i*9,
            35+i*7,
            i*.1,
            0,
            Math.PI*2
        );
        ctx.strokeStyle = p.glow;
        ctx.globalAlpha = .035;
        ctx.lineWidth = 5;
        ctx.stroke();
    }

    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(sunX,sunY,38,0,Math.PI*2);
    ctx.fillStyle = p.glow;
    ctx.fill();

    // Campo
    const groundY = H*.79;

    ctx.fillStyle = p.ground[0];
    ctx.fillRect(0,groundY,W,H-groundY);

    for(let i=0;i<850;i++) {
        const x = Math.random()*W;
        const y = groundY + Math.random()*(H-groundY);

        brush(
            x,y,
            10+Math.random()*35,
            Math.random()*.5,
            p.ground[Math.floor(Math.random()*3)],
            3+Math.random()*6
        );
    }

    // Estrelas
    if(p.stars) {
        for(let i=0;i<130;i++) {
            const x = (i*7919%W);
            const y = (i*3571%(H*.65));

            brush(
                x,y,
                2+Math.random()*5,
                0,
                "#e6d9a0",
                3
            );
        }
    }
}

// Girassol
function drawFlower(t) {
    const cx = W*.5;
    const cy = H*.43;
    const scale = Math.min(W/850,H/750,1.1);

    const breeze = Math.sin(t*.001)*.035 + wind*.07;

    ctx.save();
    ctx.translate(cx,cy);
    ctx.rotate(breeze);
    ctx.scale(scale,scale);

    // Caule
    ctx.beginPath();
    ctx.moveTo(0,55);
    ctx.bezierCurveTo(-5,170,25,290,0,440);

    ctx.strokeStyle = "#61713c";
    ctx.lineWidth = 19;
    ctx.stroke();

    // Textura do caule
    for(let i=0;i<25;i++) {
        brush(
            Math.sin(i)*7,
            75+i*13,
            18,
            .8,
            i%2 ? "#8c914e":"#394e32",
            4
        );
    }

    // Folhas
    function leaf(x,y,angle,flip) {
        ctx.save();
        ctx.translate(x,y);
        ctx.rotate(angle);
        ctx.scale(flip,1);

        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.quadraticCurveTo(70,-90,125,-30);
        ctx.quadraticCurveTo(95,35,0,0);

        ctx.fillStyle = "#60753b";
        ctx.fill();

        for(let i=0;i<15;i++) {
            brush(
                20+i*5,
                -20+i*.6,
                25,
                .3,
                i%2 ? "#9a9a50":"#384d2e",
                5
            );
        }

        ctx.beginPath();
        ctx.moveTo(0,0);
        ctx.lineTo(115,-30);
        ctx.strokeStyle="#c0a85c";
        ctx.lineWidth=2;
        ctx.stroke();

        ctx.restore();
    }

    leaf(-3,245,-.55,1);
    leaf(5,170,.55,-1);

    // Pétalas irregulares
    const petalColors = [
        "#f2c84e",
        "#dba12e",
        "#f8d76b",
        "#e9af38",
        "#c98225",
        "#ffdc78"
    ];

    for(let layer=0;layer<2;layer++) {
        const count = layer===0 ? 23 : 19;

        for(let i=0;i<count;i++) {
            const angle = (Math.PI*2/count)*i +
                layer*.13;

            const variation = Math.sin(i*12.4)*7;

            ctx.save();
            ctx.rotate(angle);

            ctx.beginPath();
            ctx.moveTo(-10,0);

            ctx.bezierCurveTo(
                -40,-35,
                -42,-105+variation,
                0,-126+variation
            );

            ctx.bezierCurveTo(
                45,-100+variation,
                38,-35,
                10,0
            );

            ctx.fillStyle =
                petalColors[i%petalColors.length];

            ctx.fill();

            // Pinceladas individuais das pétalas
            for(let j=0;j<8;j++) {
                brush(
                    Math.sin(j*3+i)*12,
                    -20-j*11,
                    12+Math.random()*22,
                    .08,
                    j%2 ? "#f9df85":"#bd7928",
                    3+Math.random()*4
                );
            }

            ctx.restore();
        }
    }

    // Centro escuro
    ctx.beginPath();
    ctx.arc(0,0,66,0,Math.PI*2);
    ctx.fillStyle="#60401f";
    ctx.fill();

    // Textura de sementes
    for(let i=0;i<550;i++) {
        const a = i*2.399;
        const r = Math.sqrt(i/550)*63;

        const x = Math.cos(a)*r;
        const y = Math.sin(a)*r;

        brush(
            x,y,
            3+Math.random()*4,
            a,
            i%3===0 ? "#d09a43" :
            i%2===0 ? "#38291a" : "#9b652b",
            3
        );
    }

    ctx.restore();
}

// Animação
let lastDraw = 0;

function animate(timestamp) {
    if(timestamp-lastDraw > 40) {
        lastDraw = timestamp;

        // Mudança suave do céu
        if(Math.abs(time-targetTime)>.002) {
            time += (targetTime-time)*.015;
        } else {
            time=targetTime;
        }

        wind += (windTarget-wind)*.03;

        if(timestamp-lastWind > 4500+Math.random()*3000) {
            windTarget = Math.random()>.5 ? 1 : -1;
            lastWind=timestamp;
        }

        if(timestamp-lastWind > 1300) {
            windTarget*=.94;
        }

        drawBackground();
        drawFlower(timestamp);
    }

    requestAnimationFrame(animate);
}

// Troca de horário
canvas.addEventListener("click",()=>{
    targetTime=(Math.floor(targetTime)+1)%4;

    document.getElementById("period").textContent =
        periods[targetTime];
});

generateSky();
resize();
requestAnimationFrame(animate);

</script>

</body>
</html>
